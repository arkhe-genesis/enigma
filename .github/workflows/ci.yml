name: Lean CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elan
        uses: leanprover/setup-lean@v1

      - name: Build CathedralArkhe
        run: lake build CathedralArkhe
